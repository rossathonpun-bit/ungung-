<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head is-center">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="rule"></span>
          <p class="lead">กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ เราจะติดต่อกลับตามช่องทางที่คุณให้ไว้</p>
        </div>

        <form class="order-form" id="orderForm">

          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn--primary btn--block">ยืนยันสั่งซื้อ</button>

        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Body Scent</span>
      <a href="product.html">เลือกสินค้าเพิ่มเติม</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
